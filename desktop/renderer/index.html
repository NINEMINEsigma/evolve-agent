<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolve Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══════════════ 配置面板 ═══════════════ -->
  <div id="config-panel" class="panel active">
    <header class="panel-header">
      <h1>Evolve Agent</h1>
      <span class="subtitle">配置启动器</span>
    </header>

    <!-- Python 路径栏 -->
    <div class="python-path-bar">
      <label for="python-path-input">Python 路径</label>
      <input type="text" id="python-path-input" class="field-input" placeholder="python（使用环境变量）" />
      <span class="path-hint">留空则使用系统 PATH 中的 python</span>
    </div>

    <!-- Profile 选择栏 -->
    <div class="profile-bar">
      <label for="profile-select">配置方案</label>
      <select id="profile-select"></select>
      <button id="btn-new-profile" class="btn btn-small">新建</button>
      <button id="btn-save-profile" class="btn btn-small">保存到 Profile</button>
    </div>

    <!-- 分组字段编辑区 -->
    <div id="fields-container" class="fields-container"></div>

    <!-- 启动栏 -->
    <div class="launch-bar">
      <button id="btn-launch" class="btn btn-primary">启动</button>
      <button id="btn-view-log" class="btn btn-small" style="display:none">查看日志</button>
      <span id="launch-hint" class="launch-hint">未修改的字段将使用 Profile 中的值</span>
    </div>
  </div>

  <!-- ═══════════════ 日志面板 ═══════════════ -->
  <div id="log-panel" class="panel">
    <header class="panel-header">
      <h2>后端日志</h2>
      <span id="status-badge" class="status-badge status-idle">等待启动</span>
    </header>
    <div id="log-output" class="log-output"></div>
    <div class="log-footer">
      <button id="btn-back-to-config" class="btn btn-small">返回配置</button>
    </div>
  </div>

  <!-- ═══════════════ 等待覆盖层 ═══════════════ -->
  <div id="waiting-overlay" class="waiting-overlay hidden">
    <div class="spinner"></div>
    <p id="waiting-text">等待后端就绪...</p>
  </div>

  <script src="config.js"></script>
  <script src="log.js"></script>
</body>
</html>
