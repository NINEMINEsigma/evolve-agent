<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolve Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══════════════ 配置面板 ═══════════════ -->
  <div id="config-panel" class="panel active">
    <header class="panel-header">
      <h1>Evolve Agent</h1>
      <span class="subtitle">配置启动器</span>
    </header>

    <p id="model-notice" class="config-notice"></p>
    <div id="config-error" class="config-error" role="alert" hidden></div>

    <!-- Python 路径栏 -->
    <div class="python-path-bar">
      <label for="python-path-input">Python 路径</label>
      <input type="text" id="python-path-input" class="field-input" placeholder="Managed Python" aria-describedby="python-path-hint python-runtime-info" disabled />
      <span id="python-path-hint" class="path-hint"></span>
      <p id="python-runtime-info" class="python-runtime-info" aria-live="polite"></p>
    </div>

    <!-- Profile 选择栏 -->
    <div class="profile-bar">
      <label for="profile-select">配置方案</label>
      <select id="profile-select" disabled></select>
      <button id="btn-new-profile" class="btn btn-small" disabled>新建</button>
      <button id="btn-save-profile" class="btn btn-small" disabled>保存到 Profile</button>
    </div>

    <!-- 分组字段编辑区 -->
    <div id="fields-container" class="fields-container"></div>

    <!-- 启动栏 -->
    <div class="launch-bar">
      <button id="btn-launch" class="btn btn-primary" disabled>启动</button>
      <button id="btn-view-log" class="btn btn-small" style="display:none">查看日志</button>
      <span id="launch-hint" class="launch-hint">未修改的字段将使用 Profile 中的值</span>
    </div>
  </div>

  <!-- ═══════════════ 日志面板 ═══════════════ -->
  <div id="log-panel" class="panel">
    <header class="panel-header">
      <h2>启动与后端日志</h2>
      <span id="status-badge" class="status-badge status-idle">等待启动</span>
    </header>
    <section id="preparation-panel" class="preparation-panel" aria-live="polite" hidden>
      <div id="preparation-spinner" class="spinner" aria-hidden="true" hidden></div>
      <p id="preparation-text"></p>
    </section>
    <div id="launch-error" class="config-error launch-error" role="alert" hidden></div>
    <div id="log-output" class="log-output"></div>
    <div class="log-footer">
      <button id="btn-cancel-launch" class="btn btn-small" disabled hidden></button>
      <button id="btn-back-to-config" class="btn btn-small">返回配置</button>
    </div>
  </div>

  <script src="../src/field-defs.js"></script>
  <script src="config.js"></script>
  <script src="log.js"></script>
</body>
</html>
