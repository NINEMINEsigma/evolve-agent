appId: site.liubai.evolve-agent
productName: EvolveAgent
directories:
  output: dist
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
files:
  - src/**/*
  - renderer/**/*
  - assets/**/*

# 后端文件复制到安装目录（exe 同级），匹配 main.js 中 REPO_ROOT 的预期布局
extraFiles:
  - from: ../run.py
    to: run.py
  - from: ../config.json.example
    to: config.json
  - from: ../config.py
    to: config.py
  - from: ../config_tui.py
    to: config_tui.py
  - from: ../check_env.py
    to: check_env.py
  - from: ../requirements.txt
    to: requirements.txt
  - from: ../SOUL.md
    to: SOUL.md
  - from: ../origin_agent
    to: origin_agent
    filter:
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!**/node_modules"
      - "!**/dist"
  - from: ../third
    to: third
    filter:
      - "!**/.git"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!**/llamaapis/lib/llama.cpp/build"
      - "!**/llamaapis/lib/llama.cpp/build-cuda"
  - from: ../custom_hooks
    to: custom_hooks
    filter:
      - "!**/.git"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../custom_tools
    to: custom_tools
    filter:
      - "!**/.git"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../custom_llm_client
    to: custom_llm_client
    filter:
      - "!**/.git"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../pre-skills
    to: skills
  - from: ../venv
    to: venv
    filter:
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: .frontend-staging/frontend
    to: workspace/fast_agent_space/frontend