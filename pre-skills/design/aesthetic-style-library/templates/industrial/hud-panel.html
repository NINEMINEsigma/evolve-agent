<!-- ==============================================================
  工业科技风 · HUD 面板模板

<div class="hud-panel" style="background:#0C1118;border:1px solid rgba(0,229,255,0.2);position:relative;padding:24px;">
  <!-- 四角括号 -->
  <span style="position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-left:1px solid rgba(0,229,255,0.7);border-top:1px solid rgba(0,229,255,0.7);"></span>
  <span style="position:absolute;top:-1px;right:-1px;width:14px;height:14px;border-right:1px solid rgba(0,229,255,0.7);border-top:1px solid rgba(0,229,255,0.7);"></span>
  <span style="position:absolute;bottom:-1px;left:-1px;width:14px;height:14px;border-left:1px solid rgba(0,229,255,0.7);border-bottom:1px solid rgba(0,229,255,0.7);"></span>
  <span style="position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-right:1px solid rgba(0,229,255,0.7);border-bottom:1px solid rgba(0,229,255,0.7);"></span>

  <!-- 头部标题栏 -->
  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,229,255,0.15);padding-bottom:10px;margin-bottom:16px;">
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.4em;color:#00E5FF;">ARCHIVE // SPECIMEN META</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:#FF2E88;">EX-01 · VERIFIED</span>
  </div>

  <!-- 内容区（插槽） -->
  <div style="color:#C9D4E0;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <!-- 你的内容 -->
  </div>
</div>

<!-- 可展开的四角括号（hover 时向外扩展 5px）-->
<div class="hud-group" style="position:relative;display:inline-block;">
  <span class="hud-corner-tl" style="position:absolute;top:-1px;left:-1px;width:10px;height:10px;border-left:1px solid #00E5FF;border-top:1px solid #00E5FF;transition:all 0.3s;"></span>
  <span class="hud-corner-tr" style="position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-right:1px solid #00E5FF;border-top:1px solid #00E5FF;transition:all 0.3s;"></span>
  <span class="hud-corner-bl" style="position:absolute;bottom:-1px;left:-1px;width:10px;height:10px;border-left:1px solid #00E5FF;border-bottom:1px solid #00E5FF;transition:all 0.3s;"></span>
  <span class="hud-corner-br" style="position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-right:1px solid #00E5FF;border-bottom:1px solid #00E5FF;transition:all 0.3s;"></span>
  <style>
    .hud-group:hover .hud-corner-tl { top: -5px; left: -5px; }
    .hud-group:hover .hud-corner-tr { top: -5px; right: -5px; }
    .hud-group:hover .hud-corner-bl { bottom: -5px; left: -5px; }
    .hud-group:hover .hud-corner-br { bottom: -5px; right: -5px; }
  </style>
</div>
