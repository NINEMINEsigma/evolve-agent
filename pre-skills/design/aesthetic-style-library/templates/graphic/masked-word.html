<style>
.char-mask {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
}
.char-mask span {
  display: inline-block;
  transform: translateY(110%);
  animation: maskedRise 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes maskedRise {
  to { transform: translateY(0%); }
}
.gx-super-title {
  font-family: 'Archivo', sans-serif;
  font-weight: 900;
  font-size: clamp(64px, 13vw, 200px);
  line-height: 0.85;
  letter-spacing: -0.02em;
}
</style>

<h1 class="gx-super-title" style="color:#111111;">
  <span class="char-mask"><span>G</span></span>
  <span class="char-mask"><span>R</span></span>
  <span class="char-mask"><span>I</span></span>
  <span class="char-mask"><span>D</span></span>
  <span class="char-mask"><span>S</span></span>
</h1>
