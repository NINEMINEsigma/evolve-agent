<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title description"><title id="title">From conversation to delivery</title><desc id="description">A fixed diagram linking a clear goal to an organized brief, independent review and an inspectable handoff.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8cccb4"/></marker></defs><rect width="1100" height="600" rx="20" fill="#101923"/><g font-family="system-ui,sans-serif"><text x="58" y="76" fill="#93d6be" font-size="14" letter-spacing="2">A CONTINUOUS WORKFLOW</text><text x="56" y="124" fill="#edf3f8" font-size="32" font-weight="600">Keep the work and the reasoning together.</text><g stroke="#8cccb4" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M274 296h66"/><path d="M510 296h66"/><path d="M746 296h66"/></g><g fill="#192b38" stroke="#395361"><rect x="56" y="218" width="218" height="158" rx="14"/><rect x="340" y="218" width="170" height="158" rx="14"/><rect x="576" y="218" width="170" height="158" rx="14"/><rect x="812" y="218" width="232" height="158" rx="14"/></g><g fill="#93d6be" font-size="12" letter-spacing="1"><text x="80" y="253">01 / START</text><text x="360" y="253">02 / ORGANIZE</text><text x="596" y="253">03 / REVIEW</text><text x="834" y="253">04 / HAND OFF</text></g><g fill="#e3edf5" font-size="22"><text x="80" y="302">A clear goal</text><text x="360" y="302">Brief</text><text x="596" y="302">Perspectives</text><text x="834" y="302">Visible results</text></g><g fill="#98acc0" font-size="13"><text x="80" y="342">Context + evidence</text><text x="360" y="342">Scope + decisions</text><text x="596" y="342">Product + design</text><text x="834" y="342">Files + checklist + page</text></g><path d="M928 392v58H165v-58" fill="none" stroke="#58766f" stroke-dasharray="5 5"/><text x="404" y="480" fill="#a6bdb2" font-size="15">Continue from the actual work.</text><text x="58" y="558" fill="#647c95" font-size="12">FIXED DEMONSTRATION / NOT A PERFORMANCE BENCHMARK</text></g></svg>
